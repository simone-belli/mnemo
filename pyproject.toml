[project]
name = "mnemo"
version = "0.1.0"
description = "A personal memory companion: short recaps pitched at your level, read aloud with word highlighting."
authors = [{ name = "Simone Belli" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.15",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
playwright = ">=1.45"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
