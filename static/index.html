<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3B34">
  <title>Mnemo</title>
  <link rel="icon" href="/static/logo/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <!-- Apply a chosen theme before first paint, so a dark page doesn't flash light. -->
  <script>try { const t = localStorage.getItem('mnemo.theme'); if (t) document.documentElement.dataset.theme = t; } catch { /* private mode */ }</script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Mnemo, home">
      <svg class="mark" viewBox="0 0 88 88" aria-hidden="true">
        <rect width="88" height="88" rx="20" fill="#1E3B34"/>
        <path d="M0 60 H88 V68 A20 20 0 0 1 68 88 H20 A20 20 0 0 1 0 68 Z" fill="#D9A84E"/>
        <polygon points="34,72 58,72 40,88 14,88" fill="#8A6526"/>
        <rect x="32" y="62" width="28" height="10" fill="#F2ECE0"/>
        <path aria-hidden="true" d="M39.3 68.53Q38.37 68.53 37.82 68.15Q37.27 67.78 36.92 67.11Q36.58 66.44 36.23 65.57Q36.05 65.05 35.88 63.51Q35.7 61.98 35.62 59.92Q35.53 57.86 35.47 55.74Q35.41 53.62 35.41 52V41.73Q35.41 38.89 35.39 36.28Q35.36 33.67 35.36 31.7V29.03Q35.36 28.39 35.68 28.19Q35.99 27.99 36.92 27.99Q38.2 27.99 39.42 28.6Q40.63 29.21 40.63 29.61Q40.63 30.54 40.37 32.57Q40.11 34.6 39.74 37.01Q39.36 39.41 39.1 41.44Q38.84 43.47 38.84 44.34Q38.84 45.1 39.19 46.17Q39.53 47.24 40.29 48.09Q41.04 48.93 42.32 48.93Q44.58 48.93 46 47.68Q47.42 46.43 49.16 43.18Q49.62 41.68 49.89 39.18Q50.15 36.69 50.29 33.9Q50.44 31.12 50.44 28.8Q50.44 28.34 50.67 28.13Q50.9 27.93 51.66 27.93Q52.58 27.93 53.45 28.34Q54.32 28.74 54.93 29.26Q55.54 29.79 55.54 30.13Q55.54 31.93 54.73 35.27Q53.92 38.6 52.76 42.6Q52.76 43.65 53.13 44.84Q53.51 46.03 54.32 46.84Q55.14 47.65 56.41 47.65Q57.51 47.65 58.38 47.16Q59.25 46.66 59.83 46.17Q60.41 45.68 60.64 45.68Q60.88 45.68 61.08 45.82Q61.28 45.97 61.28 46.2Q61.28 48.35 60.47 49.85Q59.66 51.36 58.47 52.12Q57.28 52.87 56.01 52.87Q54.67 52.87 53.54 51.42Q52.41 49.97 51.95 47.42Q51.89 46.9 51.83 46.32L51.71 45.16H51.6Q51.42 45.5 50.67 46.72Q49.91 47.94 48.81 49.36Q47.71 50.78 46.49 51.83Q45.27 52.87 44.17 52.87Q43.07 52.87 42.17 52.52Q41.27 52.17 40.58 51.62Q39.88 51.07 39.36 50.49Q38.61 49.68 38.17 49.04Q37.73 48.4 37.62 48.4Q37.21 48.4 37.21 50.38Q37.21 51.01 37.24 52.2Q37.27 53.39 37.3 54.81Q37.33 56.23 37.39 57.51Q37.45 58.79 37.45 59.6Q37.5 61.45 38.2 62.67Q38.89 63.89 39.82 64.64Q40.75 65.4 41.45 65.86Q42.14 66.33 42.14 66.73Q42.14 67.31 41.65 67.72Q41.16 68.12 40.52 68.33Q39.88 68.53 39.3 68.53Z" fill="#F2ECE0"/>
        <path d="M66 14 L80 18 L66 22 Z" fill="#C2502E"/>
        <line x1="66" y1="14" x2="66" y2="30" stroke="#F2ECE0" stroke-width="1.5"/>
      </svg>
      <span class="wordmark">Mnemo</span>
    </a>
    <div class="modes" role="radiogroup" aria-label="Mode">
      <button type="button" role="radio" data-mode="read">Read</button>
      <button type="button" role="radio" data-mode="listen">Listen</button>
      <button type="button" role="radio" data-mode="both">Read + Listen</button>
    </div>
  </header>

  <main>
    <form id="ask" autocomplete="off">
      <input id="q" type="text" placeholder="Remind me about…" aria-label="Remind me about" enterkeyhint="go">
      <button id="mic" type="button" class="icon" aria-label="Speak" title="Speak">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 15zm6-3.5a6 6 0 0 1-12 0H4.5a7.5 7.5 0 0 0 6.75 7.46V21h1.5v-2.04a7.5 7.5 0 0 0 6.75-7.46z"/></svg>
      </button>
      <button id="go" type="submit" class="primary">Recall</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <!-- First run: self-rating, then the adaptive quiz -->
    <section id="onboarding" class="card" hidden>
      <div id="rate-step">
        <h2>Where do you stand?</h2>
        <p class="muted">A quick, rough self-rating per domain. It only sets weak starting points; the quiz and every recap refine them.</p>
        <div id="ratings"></div>
        <div class="row">
          <button type="button" id="rate-go" class="primary">Continue to the quiz</button>
          <button type="button" id="rate-skip" class="link">Skip</button>
        </div>
      </div>
      <div id="quiz-step" hidden>
        <div class="progress"><div id="quiz-bar"></div></div>
        <p class="crumbs" id="quiz-topic"></p>
        <h2 id="quiz-q"></h2>
        <div id="quiz-options" class="options"></div>
        <form id="quiz-free" class="row" hidden>
          <input id="quiz-text" type="text" placeholder="Your answer" aria-label="Your answer">
          <button type="submit" class="primary">Answer</button>
        </form>
        <p id="quiz-result" class="result"></p>
        <div class="row">
          <button type="button" id="quiz-next" class="primary" hidden>Next question</button>
          <button type="button" id="quiz-stop" class="link">Stop and start using Mnemo</button>
        </div>
      </div>
    </section>

    <!-- The recap -->
    <article id="card" class="card" hidden>
      <nav class="crumbs" id="crumbs" aria-label="Topic"></nav>
      <div id="player" class="player">
        <button type="button" id="play" class="icon round" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        </button>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
        <span id="time" class="time">0:00</span>
        <button type="button" id="again" class="icon" aria-label="Play again" title="Play again">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
      </div>
      <div id="script" class="script"></div>
      <details id="written">
        <summary>Written recap</summary>
        <div id="recap" class="md"></div>
      </details>

      <div id="feedback" class="feedback">
        <button type="button" data-signal="deeper">Deeper</button>
        <button type="button" data-signal="simpler">Simpler</button>
        <button type="button" data-signal="knew_that">Knew that</button>
        <button type="button" data-signal="lost_me">Lost me</button>
      </div>
      <form id="lost" class="row" hidden>
        <input id="lost-note" type="text" placeholder="What lost you? (optional)" aria-label="What lost you">
        <button type="submit" class="primary">Send</button>
      </form>
      <p id="fb-result" class="result"></p>
    </article>

    <section id="next" class="next" hidden>
      <h3>Next</h3>
      <div id="chips" class="chips"></div>
    </section>

    <details id="debug" class="debug" hidden>
      <summary>Debug</summary>
      <div id="debug-body"></div>
    </details>
  </main>

  <footer class="foot">
    <div class="controls">
      <button type="button" id="recalibrate" class="link">Recalibrate</button>
      <button type="button" id="theme" class="link" title="Light, dark, or follow the system">Theme: auto</button>
    </div>
    <span class="muted">Remember what you know.</span>
  </footer>
</body>
</html>
